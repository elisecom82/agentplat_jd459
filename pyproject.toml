[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elisecom82-agentplat_jd459"
version = "0.1.0"
description = "把候选项映射到类别上，算出Agent 编排平台工程师·智能体的任务终止条件的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "elisecom82" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://elisecom82.github.io"
Repository = "https://github.com/elisecom82/agentplat_jd459"
Issues = "https://github.com/elisecom82/agentplat_jd459/issues"

[project.scripts]
agentplat_jd459 = "agentplat_jd459:main"

[tool.setuptools]
py-modules = ["agentplat_jd459"]
